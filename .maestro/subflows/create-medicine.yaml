appId: dev.sidequests.pilly
name: Create a test medicine
---
- retry:
    maxRetries: 3
    commands:
      - tapOn: 'Continue'
      - assertVisible: 'What should Pilly call you?'
- tapOn:
    text: 'Skip for now'
    retryTapIfNoChange: true
- assertVisible: 'Start with one medicine'
- tapOn:
    text: 'Add first medicine'
    retryTapIfNoChange: true
- assertVisible: 'Add medicine'
- assertNotVisible: 'Recognition photo'
- tapOn:
    id: 'medicine-name'
- inputText: 'Test Medicine'
- hideKeyboard
- runFlow:
    when:
      notVisible: 'Edit medicine type'
    commands:
      - swipe:
          start: 50%, 75%
          end: 50%, 30%
          duration: 500
- runFlow:
    when:
      visible: 'Edit medicine type'
    commands:
      - tapOn: 'Edit medicine type'
- assertVisible: 'Medicine type'
- tapOn:
    text: 'Capsule'
    retryTapIfNoChange: true
- assertVisible:
    text: 'Capsule'
    selected: true
- runFlow:
    when:
      visible: 'Medicine type'
    commands:
      - tapOn: 'Done'
- scrollUntilVisible:
    element:
      text: 'Reminder for Morning dose'
    direction: DOWN
- tapOn:
    text: 'Add'
    retryTapIfNoChange: true
- assertVisible: 'Today'
- assertVisible: 'Open details for Test Medicine'

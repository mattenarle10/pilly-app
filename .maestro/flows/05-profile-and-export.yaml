appId: dev.sidequests.pilly
name: Profile name export and Plus navigation
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: 'pilly-app:///'
- runFlow: ../subflows/accept-app-link.yaml
- runFlow: ../subflows/finish-empty-onboarding.yaml
- tapOn: 'Profile'
- tapOn: 'Edit name'
- tapOn:
    id: 'profile-first-name'
- inputText: 'Ada'
- pressKey: enter
- tapOn:
    text: 'Save'
    retryTapIfNoChange: true
- assertVisible: 'Ada profile initial'
- tapOn: 'Export data'
- assertVisible: 'Your data, ready to take with you.'
- tapOn:
    id: 'BackButton'
- runFlow:
    when:
      visible: 'Pilly Plus'
    commands:
      - tapOn: 'Pilly Plus'
      - assertVisible: 'Your routine follows you.'
      - tapOn:
          id: 'BackButton'
- assertVisible: 'Profile'

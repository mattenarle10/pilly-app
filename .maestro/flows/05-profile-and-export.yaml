appId: dev.sidequests.pilly
name: Profile name export and Plus navigation
---
- launchApp:
    clearState: true
- runFlow: ../subflows/finish-empty-onboarding.yaml
- tapOn: 'Profile'
- tapOn: 'Edit name'
- tapOn:
    id: 'profile-first-name'
- inputText: 'Ada'
- pressKey: enter
- tapOn:
    text: 'Save'
    retryTapIfNoChange: true
- assertVisible: 'Ada'
- tapOn: 'Export data'
- assertVisible: 'Your data, ready to take with you.'
- tapOn: 'Back'
- runFlow:
    when:
      visible: 'Pilly Plus'
    commands:
      - tapOn: 'Pilly Plus'
      - assertVisible: 'Your medicines, ready when you are.'
      - assertVisible: 'Preview · checkout off'
      - tapOn: 'Back'
- assertVisible: 'Profile'

appId: dev.sidequests.pilly
name: Edit archive restore and delete a medicine
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: allow
- openLink: 'pilly-app:///'
- runFlow: ../subflows/accept-app-link.yaml
- runFlow: ../subflows/create-medicine.yaml
- tapOn: 'Medicines'
- tapOn: 'Open Test Medicine'
- tapOn: 'Edit medicine'
- assertVisible: 'Edit medicine'
- tapOn:
    id: 'medicine-name'
- eraseText
- inputText: 'Updated Medicine'
- pressKey: enter
- tapOn: 'Done'
- assertVisible: 'Updated Medicine'
- tapOn: 'Archive'
- assertVisible: 'Archive?'
- tapOn: 'Archive'
- assertVisible: 'Restore'
- tapOn: 'Restore'
- assertVisible: 'Archive'
- tapOn: 'Delete'
- assertVisible: 'Delete medicine?'
- tapOn: 'Delete'
- assertVisible: 'Medicines'
- assertNotVisible: 'Updated Medicine'

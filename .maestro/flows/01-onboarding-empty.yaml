appId: dev.sidequests.pilly
name: Empty onboarding and primary navigation
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: 'pilly-app:///'
- runFlow: ../subflows/accept-app-link.yaml
- assertVisible: 'What’s next. What’s left.'
- runFlow: ../subflows/finish-empty-onboarding.yaml
- tapOn: 'Week'
- assertVisible: 'Week'
- tapOn: 'Medicines'
- assertVisible: 'Your medicines live here'
- tapOn: 'Today'
- tapOn: 'Profile'
- assertVisible: 'Profile'
- assertVisible: 'Your data'
- tapOn:
    id: 'BackButton'
- assertVisible: 'Today'

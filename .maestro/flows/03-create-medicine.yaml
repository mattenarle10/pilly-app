appId: dev.sidequests.pilly
name: Create medicine with appearance and reminder
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: allow
- openLink: 'pilly-app:///'
- runFlow: ../subflows/accept-app-link.yaml
- runFlow: ../subflows/create-medicine.yaml
- tapOn: 'Medicines'
- assertVisible: 'Test Medicine.*Opens medicine details.*'
- tapOn: 'Test Medicine.*Opens medicine details.*'
- assertVisible: 'Capsule · Rose + Peach'
- tapOn: 'Dose history'
- assertVisible: 'No recorded changes'
- tapOn: 'Back'
- assertVisible: 'Test Medicine'

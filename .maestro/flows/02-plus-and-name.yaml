appId: dev.sidequests.pilly
name: Optional Plus branch and profile name
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: 'See Pilly Plus'
    commands:
      - tapOn: 'See Pilly Plus'
      - assertVisible: 'Clear records, ready to share.'
      - tapOn: 'Back'
      - assertVisible: 'What’s next. What’s left.'
- retry:
    maxRetries: 3
    commands:
      - tapOn: 'Continue'
      - assertVisible: 'What should Pilly call you?'
- tapOn:
    id: 'onboarding-first-name'
- inputText: 'Ada'
- hideKeyboard
- tapOn:
    text: 'Continue'
    retryTapIfNoChange: true
- assertVisible: 'Start with one medicine'
- tapOn:
    text: 'Not now'
    retryTapIfNoChange: true
- assertVisible: 'Good .*Ada'
